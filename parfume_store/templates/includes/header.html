{% load static %}
<header>
  <nav style="padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;">

    <img src="{% static 'Icon_1.png' %}" alt="Логотип магазина" style="height: 50px;">
    
    {% if user.is_authenticated %}
      <div style="display: flex; align-items: center;">
        <span style="margin-right: 10px; font-size: 24px; color:#9B54E6;">Привет, {{ user.get_full_name|default:user.username }}!</span>
        <form method="post" action="{% url 'logout' %}" style="margin: 0;">
          {% csrf_token %}
          <button style = "font-size: 18px" type="submit">Выйти</button>
        </form>
      </div>
    {% elif request.resolver_match.url_name != 'login' %}
      <a href="{% url 'login' %}" style="padding: 5px 10px; background-color: #9B54E6; color: black; text-decoration: none; border-radius: 4px;">Войти</a>
    {% endif %}

  </nav>
</header>
