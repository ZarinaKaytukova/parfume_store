{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="{% static 'Icon_1.png' %}">
    <!-- Глобальные стили -->
    <style>
      body { font-family: 'Roboto', serif; background: linear-gradient(#9B54E680, #FFFFFF); background-attachment: fixed; margin: 20px; }
      h1 { color: #9B54E6; }
      button,
      input[type="submit"], 
      a[style*="background-color"] { background-color: #9B54E6; color: 3E3B3D; border: none; border-radius: 4px; padding: 5px 10px; cursor: pointer; text-decoration: none;}
      table { width: 100%; border-collapse: collapse; }
      th, td { border: 1px solid #000; padding: 8px; }
      th { background: #ebdcdc; }
      .product-row { background: #FFFFFF; }
      .high-discount { background: #9B54E6; }
      .out-of-stock { background: #FFFFFF; }
      .price-discount s { color: #714566; }
      .price-discount .final-price { color: 3E3B3D; }
      .product-image { max-width: 100px; }
      .controls { margin-bottom: 50px; }
    </style>
  </head>
  <body>
    {% include "includes/header.html" %}
      <main>
        {% block content %}{% endblock %}
      </main>
    {% include "includes/footer.html" %}
  </body>
</html>
